type User {
  id: ID!
  name: String!
  email: String!
  createdAt: String!
  updatedAt: String
  deletedAt: String
  lastLogin: String
  metadata: String
  count: Int!
}

type Post {
  id: ID!
  title: String!
  content: String!
  publishedAt: String
  tags: [String!]!
  categories: [String!]!
}

interface Node {
  id: ID!
  displayName: String!
}

type Comment implements Node {
  id: ID!
  displayName: String!
  body: String!
}

type Article implements Node {
  id: ID!
  displayName: String!
  body: String!
}

union SearchResult = User | Post | Comment

type Query {
  user(id: ID!): User
  post(id: ID!): Post
  node(id: ID!): Node
  search(term: String!): [SearchResult!]!
}
